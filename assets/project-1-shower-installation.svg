*{box-sizing:border-box;margin:0;padding:0} 
:root{--y:#ffd21a;--black:#080b0f;--dark:#111820;--dark2:#171f28;--ink:#11151a;--muted:#6d7680;--line:#dfe3e7} 
html{scroll-behavior:smooth} 
body{font-family:Inter,Arial,sans-serif;color:var(--ink);line-height:1.55;background:#fff} 
a{text-decoration:none;color:inherit} 
img{max-width:100%;display:block} 
.site-header{height:76px;display:flex;align-items:center;padding:6px 6.5%;gap:26px;background:#fff;position:sticky;top:0;z-index:50;box-shadow:0 2px 20px #00000012} 
.logo-wrap{width:190px;height:68px;display:flex;align-items:center} 
.logo-wrap img{width:100%;height:100%;object-fit:contain} 
#nav{display:flex;gap:26px;margin-left:auto;align-items:center} 
#nav a{font-size:13px;font-weight:800} 
#nav a.active,#nav a:hover{color:#c19a00} 
.nav-wa{background:#080b0f;color:#fff;border-radius:999px;padding:12px 18px;font-size:13px;font-weight:800} 
.menu-btn{display:none;background:none;border:0;font-size:28px} 
.hero{min-height:610px;color:#fff;position:relative;overflow:hidden;background:radial-gradient(circle at 80% 15%,#344653 0,#18232d 32%,#080b0f 72%)} 
.hero:after{content:"";position:absolute;inset:auto -10% -180px 45%;height:520px;background:linear-gradient(145deg,#263944,#0b1015);transform:skewX(-18deg);opacity:.75} 
.hero-grid{position:relative;z-index:2;max-width:1240px;margin:auto;min-height:610px;padding:78px 6.5%;display:grid;grid-template-columns:1.15fr .85fr;align-items:center} 
.hero-copy{max-width:690px} 
.kicker{color:var(--y);font-weight:900;letter-spacing:1.8px;font-size:13px;text-transform:uppercase} 
.hero h1{font-family:"Barlow Condensed",Impact,sans-serif;font-size:clamp(64px,8vw,104px);line-height:.86;letter-spacing:-2px;margin:14px 0 25px;text-transform:none} 
.hero h1 span{color:var(--y)} 
.hero p{font-size:17px;color:#e4e8eb;max-width:650px} 
.hero-actions{display:flex;gap:14px;margin:27px 0 20px;flex-wrap:wrap} 
.btn{border:0;border-radius:999px;padding:14px 22px;font-weight:900;display:inline-flex;justify-content:center;align-items:center;cursor:pointer;text-decoration:none} 
.yellow{background:var(--y);color:#0b0d10} 
.outline{border:1px solid #fff;color:#fff;background:#ffffff0a} 
.served{font-size:14px;color:#d7dde2} 
.hero-art{height:440px;display:flex;align-items:center;justify-content:center} 
.worker-card{width:430px;height:440px;position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#17212a,#0c1116);border-radius:30px;border:1px solid rgba(255,255,255,.08);box-shadow:0 30px 50px rgba(0,0,0,.25)} 
.worker-card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 60% 35%,#687b86 0,#29363f 25%,transparent 55%);opacity:.7} 
.worker-placeholder{position:relative;z-index:2;width:230px;height:300px;border-radius:115px 115px 28px 28px;background:linear-gradient(#1e252b 0 20%,#0c1014 20%);display:flex;align-items:center;justify-content:center;transform:translateY(14px)} 
.worker-placeholder:before{content:"";position:absolute;width:140px;height:180px;border-radius:50% 50% 35% 35%;background:linear-gradient(#d5c7b6,#bfae99);top:50px;left:45px;box-shadow:inset 0 12px 18px rgba(255,255,255,.22)} 
.scribble{position:absolute;right:18px;bottom:30px;color:var(--y);font-family:"Barlow Condensed";font-size:28px;line-height:.9;transform:rotate(-6deg);z-index:3} 
.dark-section{background:var(--dark);color:#fff} 
.container{max-width:1240px;margin:auto;padding-left:6.5%;padding-right:6.5%} 
.services-section{padding:72px 0} 
.section-top{display:grid;grid-template-columns:1fr .8fr auto;gap:35px;align-items:end;margin-bottom:34px} 
.section-top h2,.why-copy h2,.areas-section h2,.quote-left h2{font-family:"Barlow Condensed",Impact,sans-serif;font-size:clamp(34px,4vw,58px);line-height:.96;letter-spacing:-1px;text-transform:none} 
.section-top p,.why-copy p,.areas-section p,.quote-left p{color:#d1d8de} 
.service-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px} 
.service-card{background:#151c24;border:1px solid #ffffff0d;border-radius:10px;padding:22px;min-height:130px;display:flex;gap:12px;align-items:flex-start} 
.icon-badge{width:38px;height:38px;border-radius:50%;background:var(--y);display:grid;place-items:center;font-size:20px;flex-shrink:0} 
.service-card h3{font-size:18px;margin-bottom:4px} 
.service-card p{color:#c9cfda;font-size:13px} 
.why-section{background:#0c1116;color:#fff;display:grid;grid-template-columns:1fr 1.1fr .75fr;min-height:390px} 
.why-photo{min-height:390px;background:radial-gradient(circle at 50% 50%,#47535b,#1c2a31 35%,#0c1116 100%);display:flex;align-items:center;justify-content:center;position:relative} 
.tool-stack{font-size:40px;line-height:1.3;position:relative;z-index:2} 
.yellow-note{position:absolute;right:26px;bottom:24px;background:var(--y);color:#0b0d10;border-radius:12px;padding:12px 16px;font-size:12px;font-weight:800;line-height:1.3;text-transform:uppercase;box-shadow:0 20px 30px rgba(0,0,0,.25)} 
.why-copy{padding:65px 45px} 
.why-copy p{color:#bdc4ca;max-width:540px;margin:16px 0} 
.why-copy ul{list-style:none;display:grid;gap:10px;color:#e7eaed;font-size:14px;padding:0;margin:0} 
.trust-box{margin:55px 7% 55px 0;border:1px solid #ffffff1c;border-radius:9px;padding:25px;display:grid;gap:23px;background:#ffffff04} 
.trust-box>div{display:flex;gap:16px;align-items:center;font-weight:700} 
.check-icon{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--y);color:#0b0d10;font-weight:900} 
.work-section{padding:68px 0;background:#fff} 
.section-top.light>p{color:#707983} 
.gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:18px} 
.project-card{position:relative;border-radius:12px;overflow:hidden;background:#f2f4f5;border:1px solid #e5e7ea;box-shadow:0 12px 26px rgba(16,20,24,.08)} 
.project-card img{aspect-ratio:1.15/1;height:100%;width:100%;object-fit:cover;display:block} 
.project-label{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(8,11,15,.82);color:#fff;padding:10px 12px;border-radius:8px;font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;backdrop-filter:blur(5px)} 
.areas-section{background:linear-gradient(120deg,#121a22,#202c36);color:#fff;padding:72px 0} 
.areas-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:65px;align-items:center} 
.area-tags{display:flex;flex-wrap:wrap;gap:12px} 
.area-tags span{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);padding:12px 18px;border-radius:999px;font-weight:700;white-space:nowrap} 
.quote-section{background:#f2f4f5;padding:72px 6.5%;display:grid;grid-template-columns:.85fr 1.15fr;gap:70px;align-items:center} 
.quote-left{max-width:550px} 
.quote-box{background:#fff;border-radius:16px;padding:24px;box-shadow:0 20px 38px rgba(17,21,26,.08)} 
.quote-form{display:grid;gap:16px} 
.quote-form input,.quote-form textarea{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fbfbfc} 
.quote-form textarea{resize:vertical;min-height:120px} 
.footer{background:#070b0f;color:#fff;padding:35px 6.5%;display:grid;grid-template-columns:1.5fr 1fr 1.2fr 1.1fr;gap:28px;align-items:center} 
.footer-brand img{width:190px;height:95px;object-fit:contain;background:#fff;border-radius:10px;padding:6px} 
.footer-brand p{margin-top:10px;font-weight:700;color:var(--y)} 
.footer b{display:block;margin-bottom:8px} 
.footer a,.footer span{color:#e7ecf2} 
@media(max-width:1000px){#nav{display:none;position:absolute;top:76px;left:0;right:0;background:#fff;padding:22px 6%;flex-direction:column;align-items:flex-start;box-shadow:0 18px 35px #0002}.site-header{position:sticky}.menu-btn{display:block;margin-left:auto}.site-header.open #nav{display:flex}.hero-grid,.areas-grid,.quote-section,.why-section,.footer{grid-template-columns:1fr}.gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.service-grid{grid-template-columns:repeat(2,1fr)}} 
@media(max-width:560px){.hero-grid{padding-top:55px;padding-bottom:55px}.hero h1{font-size:65px}.section-top{display:block}.section-top>p{margin:15px 0}.service-grid,.gallery-grid{grid-template-columns:1fr}.why-copy{padding:42px 22px}.trust-box{margin:0 0 28px} .footer{grid-template-columns:1fr}} 
